[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot"
version = "1.1.0"
description = "StockPilot — a personal, autonomous AI day-trading desktop app (paper trading first)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Personal use" }
dependencies = [
    "PySide6>=6.7",
    "alpaca-py>=0.40",
    "anthropic>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "keyring>=25",
    "platformdirs>=4",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.6", "pillow>=10"]

[project.gui-scripts]
stockpilot = "stockpilot.__main__:main"

[tool.setuptools.packages.find]
include = ["stockpilot*"]

[tool.setuptools.package-data]
stockpilot = ["assets/**/*", "ui/qml/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: talks to the real Alpaca paper API (needs ALPACA_PAPER_KEY / ALPACA_PAPER_SECRET)",
    "ui: loads the QML interface offscreen",
]
