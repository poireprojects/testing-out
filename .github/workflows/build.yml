name: test & build desktop app

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build app
        run: pyinstaller packaging/dk.spec --noconfirm --clean
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $env:DK_HOME = Join-Path $env:RUNNER_TEMP "dk-selftest"
          $p = Start-Process -FilePath "dist\dontknowwhatimdoing\dontknowwhatimdoing.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $env:DK_HOME "logs\self-test.txt")
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: dontknowwhatimdoing-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build app
        run: pyinstaller packaging/dk.spec --noconfirm --clean
      - name: Self-test the packaged app
        run: |
          export DK_HOME="$RUNNER_TEMP/dk-selftest"
          "dist/don’t know what im doing.app/Contents/MacOS/dontknowwhatimdoing" --self-test || (cat "$DK_HOME/logs/self-test.txt"; exit 1)
          cat "$DK_HOME/logs/self-test.txt"
      - name: Build disk image
        run: |
          mkdir -p dist/dmg
          cp -R "dist/don’t know what im doing.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "don’t know what im doing" -srcfolder dist/dmg -ov -format UDZO dist/dontknowwhatimdoing-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dontknowwhatimdoing-macos-dmg
          path: dist/dontknowwhatimdoing-macos.dmg
          if-no-files-found: error

  latest:
    # Rolling "latest" release: permanent one-click download links for the newest build.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          cp artifacts/dontknowwhatimdoing-windows-installer/*.exe out/dontknowwhatimdoing-windows-setup.exe
          cp artifacts/dontknowwhatimdoing-macos-dmg/*.dmg out/dontknowwhatimdoing-macos.dmg
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "latest build" \
            --notes "Newest build of don’t know what im doing (commit ${GITHUB_SHA::7}). Windows: run the setup file. Mac: open the .dmg and drag the app to Applications."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
