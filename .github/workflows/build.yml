name: test & build desktop app

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels older builds, so the "latest" downloads are always the newest build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Release gate: installers and the "latest" release are built only when something that can change the
    # desktop app differs from the last published build. Research-only commits still run the test suite.
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.gate.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        run: python3 packaging/app_changed.py
      - name: An app change needs a new version and its notes in CHANGELOG.md
        if: steps.gate.outputs.app == 'true'
        run: python3 packaging/release_notes.py check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs

  windows:
    needs: [test, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build app
        run: pyinstaller packaging/stockpilot.spec --noconfirm --clean
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $env:STOCKPILOT_HOME = Join-Path $env:RUNNER_TEMP "stockpilot-selftest"
          $p = Start-Process -FilePath "dist\StockPilot\StockPilot.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $env:STOCKPILOT_HOME "logs\self-test.txt")
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Larger desktop for the window tests (best effort)
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Window frame self-test at 100 / 125 / 150 % (native hit-testing, Snap Layouts target, maximize bounds)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ui-shots"
          $fail = 0
          foreach ($s in @("1", "1.25", "1.5")) {
            $env:QT_SCALE_FACTOR = $s
            $env:STOCKPILOT_CHROME_TEST_SIZE = "1280x800"
            $env:STOCKPILOT_HOME = Join-Path $env:RUNNER_TEMP "stockpilot-chrome-$s"
            $dir = Join-Path $out "scale-$s"
            $p = Start-Process -FilePath "dist\StockPilot\StockPilot.exe" -ArgumentList "--chrome-selftest", "`"$dir`"" -PassThru
            if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; Write-Host "timed out at scale $s"; $fail = 1 }
            elseif ($p.ExitCode -ne 0) { Write-Host "exit code $($p.ExitCode) at scale $s"; $fail = 1 }
            Get-Content (Join-Path $dir "chrome-selftest.json") -ErrorAction SilentlyContinue
            Write-Host "--- progress ($s)"; Get-Content (Join-Path $dir "progress.txt") -ErrorAction SilentlyContinue
            Write-Host "--- stack if it hung ($s)"; Get-Content (Join-Path $dir "stack.txt") -ErrorAction SilentlyContinue
            Write-Host "--- app log ($s)"; Get-ChildItem (Join-Path $env:STOCKPILOT_HOME "logs") -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          }
          Remove-Item Env:QT_SCALE_FACTOR, Env:STOCKPILOT_CHROME_TEST_SIZE
          if ($fail) { throw "window frame self-test failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-screenshots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: warn
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: stockpilot-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  windows-uninstall-test:
    # Real install -> launch (tray) -> uninstall (keep data) -> reinstall -> live-position block ->
    # clean uninstall -> reinstall, on a real Windows machine.
    needs: [windows, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: stockpilot-windows-installer
          path: installer
      - name: Install / launch / uninstall / reinstall test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          ./packaging/windows/test_uninstall.ps1 -Installer $setup -Strict
      - name: Installer logs
        if: always()
        shell: pwsh
        run: Get-ChildItem $env:RUNNER_TEMP -Filter "*install-*.log" | ForEach-Object { "----- $($_.Name)"; Get-Content $_.FullName -Tail 40 }

  upgrade-from-previous:
    # Upgrade in place from the last release published under the app's previous name (build 48): the running
    # copy is closed by its own safety check, its program folder and shortcuts are removed, and its data,
    # launch-at-login entry and saved key move to StockPilot. A release requires this to pass.
    needs: [windows, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: stockpilot-windows-installer
          path: installer
      - name: Download the last release under the previous name
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download build-48 -R ${{ github.repository }} -p "*windows-setup.exe" -D previous
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::build 48 is no longer published; the upgrade test is skipped"; exit 0 }
      - name: Upgrade test
        shell: pwsh
        run: |
          $old = Get-ChildItem previous\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $old) { Write-Host "no previous installer: skipped"; exit 0 }
          $new = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          ./packaging/windows/test_upgrade.ps1 -OldInstaller $old.FullName -NewInstaller $new

  macos:
    needs: [test, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build app
        run: pyinstaller packaging/stockpilot.spec --noconfirm --clean
      - name: Self-test the packaged app
        run: |
          export STOCKPILOT_HOME="$RUNNER_TEMP/stockpilot-selftest"
          "dist/StockPilot.app/Contents/MacOS/StockPilot" --self-test || (cat "$STOCKPILOT_HOME/logs/self-test.txt"; exit 1)
          cat "$STOCKPILOT_HOME/logs/self-test.txt"
      - name: Build disk image
        run: |
          mkdir -p dist/dmg
          cp -R "dist/StockPilot.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "StockPilot" -srcfolder dist/dmg -ov -format UDZO dist/StockPilot-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: stockpilot-macos-dmg
          path: dist/StockPilot-macos.dmg
          if-no-files-found: error

  latest:
    # Rolling "latest" release: published as soon as the test suite, the Windows build and the real Windows
    # install/uninstall test pass. The Mac disk image is attached by `latest-mac` when its build finishes,
    # so a slow or unavailable macOS runner never holds back a tested Windows installer.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.app == 'true'
    needs: [test, changes, windows, windows-uninstall-test, upgrade-from-previous]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stockpilot-windows-installer
          path: artifacts/windows
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          cp artifacts/windows/*.exe out/StockPilot-windows-setup.exe
          # Title and notes come from CHANGELOG.md (packaging/release_notes.py): this version's notes first,
          # then every earlier version.
          python3 packaging/release_notes.py notes "${GITHUB_RUN_NUMBER}" "$GITHUB_SHA" > notes.md
          # One release per build (deleted release tags can't be reused here), marked "latest" so
          # https://github.com/<repo>/releases/latest/download/<file> always serves the newest build.
          gh release create "build-${GITHUB_RUN_NUMBER}" out/* --target "$GITHUB_SHA" --latest \
            --title "$(python3 packaging/release_notes.py title "${GITHUB_RUN_NUMBER}")" \
            --notes-file notes.md
      - name: Notes for the earlier releases
        # Keeps every earlier release's title and notes in step with CHANGELOG.md. Best effort: a failure here
        # never affects the release just published.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(python3 packaging/release_notes.py old-builds "${GITHUB_RUN_NUMBER}"); do
            gh release view "build-$n" > /dev/null 2>&1 || continue
            python3 packaging/release_notes.py old-notes "$n" > "old-$n.md"
            gh release edit "build-$n" --latest=false --title "$(python3 packaging/release_notes.py old-title "$n")" \
              --notes-file "old-$n.md" || echo "::warning::could not update the notes of build-$n"
          done

  latest-mac:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.app == 'true'
    needs: [changes, latest, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stockpilot-macos-dmg
          path: artifacts/mac
      - name: Attach the Mac disk image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp artifacts/mac/*.dmg StockPilot-macos.dmg
          gh release upload "build-${GITHUB_RUN_NUMBER}" StockPilot-macos.dmg --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-uninstall-test, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
