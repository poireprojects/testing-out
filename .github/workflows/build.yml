name: test & build desktop app

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels older builds, so the "latest" downloads are always the newest build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build app
        run: pyinstaller packaging/dk.spec --noconfirm --clean
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $env:DK_HOME = Join-Path $env:RUNNER_TEMP "dk-selftest"
          $p = Start-Process -FilePath "dist\dontknowwhatimdoing\dontknowwhatimdoing.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $env:DK_HOME "logs\self-test.txt")
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: dontknowwhatimdoing-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  windows-uninstall-test:
    # Real install -> launch (tray) -> uninstall (keep data) -> reinstall -> live-position block ->
    # clean uninstall -> reinstall, on a real Windows machine.
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: dontknowwhatimdoing-windows-installer
          path: installer
      - name: Install / launch / uninstall / reinstall test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          ./packaging/windows/test_uninstall.ps1 -Installer $setup -Strict
      - name: Installer logs
        if: always()
        shell: pwsh
        run: Get-ChildItem $env:RUNNER_TEMP -Filter "*install-*.log" | ForEach-Object { "----- $($_.Name)"; Get-Content $_.FullName -Tail 40 }

  uninstall-repro-previous:
    # Evidence of the original bug: the same test against the previously published installer (build 9).
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 12   # the old installer can hang on the newer failure scenarios; it's evidence only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download build 9 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-9 -R ${{ github.repository }} -p "*windows-setup.exe" -D old
      - name: Same test against build 9 (expected to fail)
        shell: pwsh
        run: ./packaging/windows/test_uninstall.ps1 -Installer old\dontknowwhatimdoing-windows-setup.exe

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build app
        run: pyinstaller packaging/dk.spec --noconfirm --clean
      - name: Self-test the packaged app
        run: |
          export DK_HOME="$RUNNER_TEMP/dk-selftest"
          "dist/don’t know what im doing.app/Contents/MacOS/dontknowwhatimdoing" --self-test || (cat "$DK_HOME/logs/self-test.txt"; exit 1)
          cat "$DK_HOME/logs/self-test.txt"
      - name: Build disk image
        run: |
          mkdir -p dist/dmg
          cp -R "dist/don’t know what im doing.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "don’t know what im doing" -srcfolder dist/dmg -ov -format UDZO dist/dontknowwhatimdoing-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dontknowwhatimdoing-macos-dmg
          path: dist/dontknowwhatimdoing-macos.dmg
          if-no-files-found: error

  latest:
    # Rolling "latest" release: permanent one-click download links for the newest build.
    # The Windows installer is published once its own build, the test suite and the real install/
    # uninstall test pass. The Mac disk image is added when its build succeeded (a missing macOS
    # runner must not hold back a tested Windows installer).
    if: >-
      always() && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') &&
      needs.test.result == 'success' && needs.windows.result == 'success' &&
      needs.windows-uninstall-test.result == 'success'
    needs: [test, windows, windows-uninstall-test, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          cp artifacts/dontknowwhatimdoing-windows-installer/*.exe out/dontknowwhatimdoing-windows-setup.exe
          if ls artifacts/dontknowwhatimdoing-macos-dmg/*.dmg >/dev/null 2>&1; then
            cp artifacts/dontknowwhatimdoing-macos-dmg/*.dmg out/dontknowwhatimdoing-macos.dmg
            MAC_NOTE="Mac: open the .dmg and drag the app to Applications."
          else
            MAC_NOTE="(The Mac build didn't finish for this build; use an earlier release for macOS.)"
          fi
          # One release per build (deleted release tags can't be reused here), marked "latest" so
          # https://github.com/<repo>/releases/latest/download/<file> always serves the newest build.
          gh release create "build-${GITHUB_RUN_NUMBER}" out/* --target "$GITHUB_SHA" --latest \
            --title "build ${GITHUB_RUN_NUMBER}" \
            --notes "Newest build of don’t know what im doing (commit ${GITHUB_SHA::7}). Windows: run the setup file. ${MAC_NOTE}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-uninstall-test, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
